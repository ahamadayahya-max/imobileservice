<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Connexion Admin — i-Mobile Service</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#f8f9fc;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .login-wrap{width:100%;max-width:380px;padding:1.5rem;}
    .login-box{background:#fff;border-radius:18px;padding:2.5rem 2rem;box-shadow:0 8px 32px rgba(0,0,0,.1);}
    .login-logo{text-align:center;margin-bottom:2rem;}
    .login-logo-text{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:800;color:#8b1a1a;}
    .login-logo-text span{color:#1a1a2e;}
    .login-logo-sub{font-size:.78rem;color:#aaa;margin-top:4px;}
    .form-group{margin-bottom:1rem;}
    .form-label{display:block;font-size:.83rem;font-weight:600;color:#555;margin-bottom:.4rem;}
    .form-input{width:100%;padding:.75rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:.92rem;font-family:inherit;transition:border-color .2s;}
    .form-input:focus{outline:none;border-color:#8b1a1a;}
    .btn-login{width:100%;padding:.85rem;background:#8b1a1a;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s;margin-top:.5rem;}
    .btn-login:hover{background:#6d1515;}
    .btn-login:disabled{background:#ccc;cursor:not-allowed;}
    .error-msg{background:#fee2e2;color:#dc2626;padding:.75rem 1rem;border-radius:8px;font-size:.85rem;font-weight:600;margin-bottom:1rem;display:none;}
    .error-msg.visible{display:block;}
    .lock-msg{background:#fef3c7;color:#92400e;padding:.75rem 1rem;border-radius:8px;font-size:.83rem;font-weight:600;margin-bottom:1rem;display:none;}
    .lock-msg.visible{display:block;}
    .back-link{text-align:center;margin-top:1.25rem;font-size:.82rem;color:#888;}
    .back-link a{color:#8b1a1a;text-decoration:none;font-weight:600;}
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-text">i-Mobile <span>Service</span></div>
      <div class="login-logo-sub">🔐 Espace administration</div>
    </div>

    <div class="lock-msg" id="lock-msg"></div>
    <div class="error-msg" id="error-msg">Identifiants incorrects. Essais restants : <span id="attempts-left">3</span></div>

    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input type="email" id="email" class="form-input" placeholder="admin@imobileservice.fr" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Mot de passe</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')seConnecter()">
    </div>

    <button class="btn-login" id="btn-login" onclick="seConnecter()">Se connecter →</button>

    <div class="back-link"><a href="../index.html">← Retour au site</a></div>
  </div>
</div>

<script src="auth.js"></script>
<script>
  /* Si déjà connecté → dashboard */
  if (isAdminLoggedIn()) window.location.replace('dashboard.html');

  function seConnecter() {
    /* Vérifier blocage */
    if (isLocked()) {
      afficherBlocage(); return;
    }

    const email = document.getElementById('email').value.trim();
    const pwd   = document.getElementById('password').value;
    const btn   = document.getElementById('btn-login');

    btn.disabled = true;
    btn.textContent = 'Vérification…';

    /* Délai anti-brute-force */
    setTimeout(() => {
      if (email === ADMIN_EMAIL && btoa(pwd) === ADMIN_PWD_B64) {
        clearAttempts();
        createSession();
        window.location.replace('dashboard.html');
      } else {
        recordFailedAttempt();
        const errorEl = document.getElementById('error-msg');
        const attemptsLeft = Math.max(0, 3 - parseInt(localStorage.getItem(ATTEMPT_KEY) || '0'));
        document.getElementById('attempts-left').textContent = attemptsLeft;
        errorEl.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Se connecter →';
        document.getElementById('password').value = '';
        if (isLocked()) afficherBlocage();
      }
    }, 600);
  }

  function afficherBlocage() {
    const lockEl = document.getElementById('lock-msg');
    const btn    = document.getElementById('btn-login');
    const sec    = getLockRemaining();
    const min    = Math.ceil(sec / 60);
    lockEl.textContent = `⛔ Trop de tentatives. Réessayez dans ${min} minute${min > 1 ? 's' : ''}.`;
    lockEl.classList.add('visible');
    document.getElementById('error-msg').classList.remove('visible');
    btn.disabled = true;

    /* Décompte */
    const timer = setInterval(() => {
      if (!isLocked()) {
        clearInterval(timer);
        lockEl.classList.remove('visible');
        btn.disabled = false;
      } else {
        const s = getLockRemaining();
        const m = Math.ceil(s / 60);
        lockEl.textContent = `⛔ Trop de tentatives. Réessayez dans ${m} minute${m > 1 ? 's' : ''}.`;
      }
    }, 5000);
  }
</script>
</body>
</html>
