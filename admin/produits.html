<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Produits — Admin i-Mobile Service</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">🔧 i-Mobile Service<span>Administration</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="produits.html" class="active"><span class="nav-icon">📦</span> Produits</a>
      <a href="photos.html"><span class="nav-icon">🖼️</span> Photos</a>
      <a href="prix.html"><span class="nav-icon">💰</span> Prix</a>
      <a href="commandes.html"><span class="nav-icon">📋</span> Commandes</a>
      <a href="devis.html"><span class="nav-icon">📩</span> Devis reçus</a>
    </nav>
    <div class="sidebar-footer"><button class="btn-logout" onclick="adminLogout()">🚪 Déconnexion</button></div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-title">📦 Gestion des produits</div>
      <div class="topbar-right">
        <button class="btn-admin btn-secondary btn-sm" onclick="exportCSV()">📥 Exporter CSV</button>
        <button class="btn-admin btn-primary btn-sm" onclick="ouvrirModalAjout()">+ Ajouter produit</button>
      </div>
    </div>

    <div class="admin-content">
      <div class="data-card">
        <div class="card-header">
          <div class="search-bar">
            <input type="text" id="search" class="admin-input" placeholder="🔍 Rechercher..." oninput="filtrerProduits()" style="width:200px;">
            <select id="filter-cat" class="admin-select" onchange="filtrerProduits()">
              <option value="">Toutes catégories</option>
              <option value="telephone">📱 Téléphones</option>
              <option value="pc">💻 PC & Tablettes</option>
              <option value="protection">🛡️ Protection</option>
              <option value="coque">🎨 Coques</option>
              <option value="chargeur">⚡ Chargeurs</option>
              <option value="cable">🔗 Câbles</option>
              <option value="audio">🎧 Audio</option>
              <option value="accessoire">🔧 Accessoires</option>
            </select>
          </div>
          <span id="produits-count" style="font-size:.85rem;color:#888;"></span>
        </div>
        <div style="overflow-x:auto;">
          <table class="data-table" id="produits-table">
            <thead>
              <tr>
                <th>Photo</th><th>Nom</th><th>Catégorie</th>
                <th>Prix</th><th>Badge</th><th>Visible</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="produits-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal ajout/édition -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:none;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:14px;padding:1.5rem;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;">
    <h3 style="font-family:'Space Grotesk',sans-serif;margin-bottom:1rem;" id="modal-title">✏️ Modifier le produit</h3>
    <div style="display:flex;flex-direction:column;gap:.75rem;">
      <div><label class="form-label">Nom</label><input type="text" id="edit-nom" class="admin-input" style="width:100%;"></div>
      <div><label class="form-label">Prix (€)</label><input type="number" id="edit-prix" class="admin-input" style="width:100%;" step="0.01" min="0"></div>
      <div><label class="form-label">Catégorie</label>
        <select id="edit-cat" class="admin-select" style="width:100%;">
          <option value="telephone">Téléphone</option><option value="pc">PC/Tablette</option>
          <option value="protection">Protection</option><option value="coque">Coque</option>
          <option value="chargeur">Chargeur</option><option value="cable">Câble</option>
          <option value="audio">Audio</option><option value="accessoire">Accessoire</option>
        </select>
      </div>
      <div><label class="form-label">Badge</label>
        <select id="edit-badge" class="admin-select" style="width:100%;">
          <option value="">Aucun</option><option value="bestseller">Bestseller</option>
          <option value="nouveau">Nouveau</option><option value="pro">Pro</option>
        </select>
      </div>
      <div style="display:flex;gap:1rem;margin-top:.5rem;">
        <button class="btn-admin btn-ghost" onclick="fermerModal()" style="flex:1;">Annuler</button>
        <button class="btn-admin btn-primary" onclick="sauvegarderProduit()" style="flex:1;">✅ Sauvegarder</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="../js/catalogue.js"></script>
<script src="../js/images.js"></script>
<script src="auth.js"></script>
<script>
  requireAuth();

  let catalogue = [];
  let hidden    = JSON.parse(localStorage.getItem('ims_hidden') || '[]');
  let prices    = JSON.parse(localStorage.getItem('ims_prices') || '{}');
  let editId    = null;

  const catLabels = {
    telephone:'📱 Téléphones', pc:'💻 PC/Tab', protection:'🛡️ Protection',
    coque:'🎨 Coques', chargeur:'⚡ Chargeurs', cable:'🔗 Câbles',
    audio:'🎧 Audio', accessoire:'🔧 Accessoires'
  };

  document.addEventListener('DOMContentLoaded', () => {
    catalogue = (typeof CATALOGUE !== 'undefined') ? [...CATALOGUE] : [];
    /* Appliquer prix modifiés */
    catalogue = catalogue.map(p => ({ ...p, prix: prices[p.id] ?? p.prix }));
    afficherProduits(catalogue);
  });

  function filtrerProduits() {
    const q   = document.getElementById('search').value.toLowerCase();
    const cat = document.getElementById('filter-cat').value;
    const res = catalogue.filter(p =>
      (!cat || p.categorie === cat) &&
      (!q   || p.nom.toLowerCase().includes(q) || p.marque?.toLowerCase().includes(q))
    );
    afficherProduits(res);
  }

  function afficherProduits(liste) {
    document.getElementById('produits-count').textContent = liste.length + ' produit(s)';
    const tbody = document.getElementById('produits-tbody');
    if (!liste.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;color:#aaa;">Aucun produit</td></tr>';
      return;
    }
    tbody.innerHTML = liste.map(p => {
      const imgUrl = (typeof IMAGES !== 'undefined' && IMAGES[p.id]) ? IMAGES[p.id].src : null;
      const isHidden = hidden.includes(p.id);
      return `<tr>
        <td>${imgUrl ? `<img src="${imgUrl}" alt="${p.nom}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;">` : p.emoji}</td>
        <td><strong>${p.nom}</strong><br><span style="font-size:.75rem;color:#888;">${p.marque || ''}</span></td>
        <td><span style="font-size:.78rem;">${catLabels[p.categorie] || p.categorie}</span></td>
        <td>
          <span class="price-editable" onclick="editerPrixInline(${p.id}, this)" id="price-${p.id}">${p.prix.toFixed(2).replace('.',',')}€</span>
        </td>
        <td>${p.badge ? `<span class="badge badge-devis">${p.badge}</span>` : '—'}</td>
        <td>
          <label class="toggle-switch">
            <input type="checkbox" ${!isHidden ? 'checked' : ''} onchange="toggleVisible(${p.id}, this.checked)">
            <span class="toggle-slider"></span>
          </label>
        </td>
        <td style="white-space:nowrap;">
          <button class="btn-admin btn-ghost btn-sm" onclick="ouvrirModal(${p.id})">✏️</button>
          <button class="btn-admin btn-secondary btn-sm" onclick="window.location.href='photos.html'">🖼️</button>
        </td>
      </tr>`;
    }).join('');
  }

  function editerPrixInline(id, el) {
    const p = catalogue.find(x => x.id === id);
    if (!p) return;
    const oldTxt = el.textContent;
    el.contentEditable = 'true';
    el.focus();
    const sel = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(el);
    sel.removeAllRanges();
    sel.addRange(range);
    el.onblur = () => {
      el.contentEditable = 'false';
      const val = parseFloat(el.textContent.replace(',','.').replace('€',''));
      if (!isNaN(val) && val >= 0) {
        prices[id] = val;
        localStorage.setItem('ims_prices', JSON.stringify(prices));
        p.prix = val;
        el.textContent = val.toFixed(2).replace('.',',') + '€';
        adminToast('Prix mis à jour', 'success');
      } else {
        el.textContent = oldTxt;
      }
    };
    el.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } };
  }

  function toggleVisible(id, visible) {
    if (visible) hidden = hidden.filter(x => x !== id);
    else if (!hidden.includes(id)) hidden.push(id);
    localStorage.setItem('ims_hidden', JSON.stringify(hidden));
    adminToast(visible ? 'Produit affiché' : 'Produit masqué');
  }

  function ouvrirModal(id) {
    const p = catalogue.find(x => x.id === id);
    if (!p) return;
    editId = id;
    document.getElementById('modal-title').textContent = '✏️ Modifier — ' + p.nom;
    document.getElementById('edit-nom').value   = p.nom;
    document.getElementById('edit-prix').value  = p.prix;
    document.getElementById('edit-cat').value   = p.categorie;
    document.getElementById('edit-badge').value = p.badge || '';
    document.getElementById('modal-overlay').style.display = 'flex';
  }

  function ouvrirModalAjout() {
    editId = null;
    document.getElementById('modal-title').textContent = '+ Ajouter un produit';
    document.getElementById('edit-nom').value = '';
    document.getElementById('edit-prix').value = '';
    document.getElementById('edit-cat').value = 'accessoire';
    document.getElementById('edit-badge').value = '';
    document.getElementById('modal-overlay').style.display = 'flex';
  }

  function fermerModal() { document.getElementById('modal-overlay').style.display = 'none'; }

  function sauvegarderProduit() {
    const nom   = document.getElementById('edit-nom').value.trim();
    const prix  = parseFloat(document.getElementById('edit-prix').value);
    const cat   = document.getElementById('edit-cat').value;
    const badge = document.getElementById('edit-badge').value || undefined;
    if (!nom || isNaN(prix)) { adminToast('Champs requis', 'error'); return; }
    if (editId) {
      const p = catalogue.find(x => x.id === editId);
      if (p) { p.nom = nom; p.prix = prix; p.categorie = cat; p.badge = badge; prices[editId] = prix; }
    } else {
      const newId = Math.max(...catalogue.map(x => x.id)) + 1;
      catalogue.push({ id: newId, nom, prix, categorie: cat, badge, emoji: '📦', marque: '', disponible: true });
    }
    localStorage.setItem('ims_prices', JSON.stringify(prices));
    fermerModal();
    filtrerProduits();
    adminToast('Produit sauvegardé', 'success');
  }

  function exportCSV() {
    const rows = [['ID','Nom','Categorie','Prix','Badge','Visible']];
    catalogue.forEach(p => rows.push([p.id, p.nom, p.categorie, p.prix, p.badge || '', !hidden.includes(p.id) ? 'Oui' : 'Non']));
    const csv = rows.map(r => r.map(v => `"${v}"`).join(';')).join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent('﻿' + csv);
    a.download = 'produits-ims.csv';
    a.click();
    adminToast('CSV exporté', 'success');
  }

  /* Fermer modal en cliquant dehors */
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) fermerModal();
  });
</script>
</body>
</html>
