<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Commandes — Admin i-Mobile Service</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">🔧 i-Mobile Service<span>Administration</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="produits.html"><span class="nav-icon">📦</span> Produits</a>
      <a href="photos.html"><span class="nav-icon">🖼️</span> Photos</a>
      <a href="prix.html"><span class="nav-icon">💰</span> Prix</a>
      <a href="commandes.html" class="active"><span class="nav-icon">📋</span> Commandes</a>
      <a href="factures.html"><span class="nav-icon">🧾</span> Factures</a>
      <a href="devis.html"><span class="nav-icon">📩</span> Devis reçus</a>
      <a href="rdv.html"><span class="nav-icon">📅</span> Rendez-vous</a>
      <a href="messages.html"><span class="nav-icon">✉️</span> Messages</a>
    </nav>
    <div class="sidebar-footer"><button class="btn-logout" onclick="adminLogout()">🚪 Déconnexion</button></div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-title">📋 Commandes boutique</div>
      <div class="topbar-right">
        <button class="btn-admin btn-ghost btn-sm" onclick="chargerCommandes()">↻ Actualiser</button>
      </div>
    </div>
    <div class="admin-content">

      <div class="kpi-grid" style="margin-bottom:1.5rem;" id="kpi-commandes"></div>

      <div class="data-card">
        <div class="card-header">
          <span class="card-title">📋 Toutes les commandes</span>
          <input type="text" id="search-cmd" class="admin-input" placeholder="🔍 Nom, N° commande..." oninput="filtrerCommandes()" style="width:200px;">
        </div>
        <div style="overflow-x:auto;">
          <table class="data-table">
            <thead><tr><th>N°</th><th>Date</th><th>Client</th><th>Produits</th><th>Livraison</th><th>Total</th><th>Statut</th><th>Actions</th></tr></thead>
            <tbody id="commandes-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="auth.js"></script>
<script>
  requireAuth();
  /* Commandes enregistrées sur le serveur (/api/dossiers) : toutes les
     commandes du site, quel que soit l'appareil du client. */
  let commandes = [];

  const statutLabels = { en_attente:'En attente', confirmee:'Confirmée', expediee:'Expédiée', livree:'Livrée', annulee:'Annulée' };
  const statutBadges = { en_attente:'badge-attente', confirmee:'badge-confirmee', expediee:'badge-expediee', livree:'badge-livree', annulee:'badge-annulee' };
  const livraisonLabels = { store:'🏪 Retrait boutique', pickup:'📦 Point Relais', vinted:'🔁 Vinted Locker', delivery:'🚚 Livraison' };
  const esc = t => String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const euros = n => Number(n || 0).toFixed(2).replace('.', ',') + '€';

  document.addEventListener('DOMContentLoaded', chargerCommandes);

  async function chargerCommandes() {
    const tbody = document.getElementById('commandes-tbody');
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:2rem;color:#aaa;">Chargement…</td></tr>';
    try {
      const res = await fetch('/api/dossiers?type=commande', { credentials: 'same-origin' });
      if (res.status === 401) { window.location.replace('login.html'); return; }
      const json = await res.json();
      if (!res.ok) throw new Error(json.message || 'HTTP ' + res.status);
      commandes = json.dossiers || [];
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:2rem;color:#dc2626;">Impossible de charger les commandes : ${esc(err.message)}</td></tr>`;
      return;
    }
    afficherKPI();
    filtrerCommandes();
  }

  function afficherKPI() {
    const actives = commandes.filter(c => c.statut !== 'annulee');
    const ca = actives.reduce((s, c) => s + Number(c.total || 0), 0);
    const en_attente = commandes.filter(c => !c.statut || c.statut === 'en_attente').length;
    document.getElementById('kpi-commandes').innerHTML = `
      <div class="kpi-card"><div class="kpi-icon">📋</div><div class="kpi-label">Total commandes</div><div class="kpi-value">${commandes.length}</div></div>
      <div class="kpi-card"><div class="kpi-icon">💶</div><div class="kpi-label">CA (hors annulées)</div><div class="kpi-value">${ca.toFixed(0)}€</div></div>
      <div class="kpi-card"><div class="kpi-icon">⏳</div><div class="kpi-label">En attente</div><div class="kpi-value">${en_attente}</div></div>`;
  }

  function filtrerCommandes() {
    const q = (document.getElementById('search-cmd').value || '').toLowerCase();
    afficherCommandes(commandes.filter(c =>
      !q || c.id?.toLowerCase().includes(q) || c.client?.nom?.toLowerCase().includes(q)
    ));
  }

  function afficherCommandes(liste) {
    const tbody = document.getElementById('commandes-tbody');
    if (!liste.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:2rem;color:#aaa;">Aucune commande.</td></tr>';
      return;
    }
    tbody.innerHTML = liste.map(c => {
      const i = commandes.indexOf(c);
      const statut  = c.statut || 'en_attente';
      const articles = Array.isArray(c.articles) ? c.articles.map(a => `${a.name} ×${a.qty}`).join(', ') : '—';
      const modeLiv = c.livraison?.mode;
      const livraisonBase = livraisonLabels[modeLiv]
        ? `<span class="badge badge-livraison-${modeLiv}">${livraisonLabels[modeLiv]}</span>`
        : esc(modeLiv || '—');
      const relais = c.livraison?.relais;
      const livraison = relais
        ? `${livraisonBase}<br><small style="color:#8b1a1a;font-weight:600;">📍 ${esc(relais.nom)}</small><br><small style="color:#666;">${esc(relais.adresse)}</small>`
        : livraisonBase;
      const sujet = encodeURIComponent(`Commande ${c.id} — i-Mobile Service`);
      const corps = encodeURIComponent(`Bonjour ${c.client?.nom || ''},\n\nConcernant votre commande ${c.id}...\n\nCordialement,\ni-Mobile Service`);
      return `<tr>
        <td><span class="badge badge-commande">${esc(c.id)}</span></td>
        <td style="white-space:nowrap;font-size:.82rem;">${esc(c.date)}</td>
        <td>
          <strong>${esc(c.client?.nom || '—')}</strong><br>
          <a href="tel:${esc(c.client?.phone)}" style="font-size:.78rem;color:#8b1a1a;">${esc(c.client?.phone || '')}</a>
        </td>
        <td style="max-width:180px;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(articles)}">${esc(articles)}</td>
        <td style="font-size:.82rem;">${livraison}</td>
        <td><strong>${euros(c.total)}</strong>${Number(c.frais) > 0 ? `<br><small style="color:#888;">dont livraison ${euros(c.frais)}</small>` : ''}</td>
        <td>
          <select class="admin-select" style="font-size:.78rem;padding:.3rem .5rem;" onchange="changerStatut(${i}, this.value)">
            ${Object.entries(statutLabels).map(([v,l]) => `<option value="${v}" ${v === statut ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </td>
        <td style="white-space:nowrap;">
          <button class="btn-admin btn-primary btn-sm" title="Créer la facture" onclick="facturer(${i})">🧾</button>
          <a href="mailto:${esc(c.client?.email)}?subject=${sujet}&body=${corps}" class="btn-admin btn-ghost btn-sm">✉️</a>
          <button class="btn-admin btn-danger btn-sm" onclick="supprimerCommande(${i})">✕</button>
        </td>
      </tr>`;
    }).join('');
  }

  async function appelAdmin(action, corps) {
    const res = await fetch('/api/dossiers?type=commande&action=' + action, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(corps),
    });
    if (res.status === 401) { window.location.replace('login.html'); throw new Error('Session expirée'); }
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.message || 'HTTP ' + res.status);
    return json;
  }

  async function changerStatut(i, statut) {
    try {
      const { dossier } = await appelAdmin('statut', { cle: commandes[i].cle, statut });
      commandes[i] = dossier;
      afficherKPI();
      adminToast('Statut mis à jour : ' + statutLabels[statut], 'success');
    } catch (err) {
      adminToast('Non enregistré : ' + err.message, 'error');
      filtrerCommandes();
    }
  }

  async function supprimerCommande(i) {
    if (!confirm(`Supprimer définitivement la commande ${commandes[i].id} ?`)) return;
    try {
      await appelAdmin('supprimer', { cle: commandes[i].cle });
      commandes.splice(i, 1);
      afficherKPI();
      filtrerCommandes();
      adminToast('Commande supprimée', 'success');
    } catch (err) {
      adminToast('Suppression impossible : ' + err.message, 'error');
    }
  }

  /* Ouvre la page Factures pré-remplie avec cette commande */
  function facturer(i) {
    sessionStorage.setItem('ims_facturer', JSON.stringify(commandes[i]));
    window.location.href = 'factures.html?depuis=commande';
  }
</script>
</body>
</html>
